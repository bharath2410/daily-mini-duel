<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Mini-Duel | 60-Second Trivia Arena{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/arcade.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars-bg"></div>
    <header class="main-header">
        <div class="header-content">
            <a href="{% url 'duel:home' %}" class="logo">
                <span class="logo-pixel">⚡ MINI-DUEL</span>
                <span class="logo-badge">LIVE ARENA</span>
            </a>
            <div class="auth-nav">
                {% if user.is_authenticated %}
                    <span class="user-handle">👾 {{ user.username }}</span>
                    <a href="{% url 'duel:logout' %}" class="nav-link">LOGOUT</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <p>New Duel rotates daily • Built with Django & Render</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
