{% extends 'base.html' %}

{% block content %}
<div class="arcade-card auth-card">
    <div class="badge-tag">AUTHENTICATION</div>
    <h1 class="section-title">{{ title }}</h1>

    <form method="POST" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="field-error">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">{{ btn_text }}</button>
    </form>
</div>
{% endblock %}
